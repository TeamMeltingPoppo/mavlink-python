name: Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check dialect update
        id: dialect
        run: |
          LATEST_TAG=$(git tag --list --sort=-version:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release tag found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$LATEST_TAG" HEAD -- mavlink-dialect; then
            echo "Dialect was not updated."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Dialect was updated."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: version
        if: steps.dialect.outputs.changed == 'true'
        run: |
          LATEST_TAG=$(git tag --list --sort=-version:refname | head -n 1)
          VERSION="${LATEST_TAG#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"

          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        id: tag
        if: steps.dialect.outputs.changed == 'true'
        run: |
          TAG="${{ steps.version.outputs.version }}"

          git tag "$TAG"
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.dialect.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        if: steps.dialect.outputs.changed == 'true'
        run: uv python install 3.14

      - name: Generate
        if: steps.dialect.outputs.changed == 'true'
        run: uv run --locked python scripts/generate.py

      - name: Create package
        if: steps.dialect.outputs.changed == 'true'
        run: uv build --wheel

      - name: Create release
        if: steps.dialect.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/mavlink-*